[project]
name = "cloudpilot-backend"
version = "0.1.0"
description = "CloudPilot API foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

